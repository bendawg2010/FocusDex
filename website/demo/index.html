<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FocusDex — Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF6B6B;
    --magenta:#C147FF;
    --blue:#47A0FF;
    --mint:#2EE6A0;
    --yellow:#FFD960;
    --cashgreen:#00D632;
    --bg:#06010f;
    --bg-2:#0e0820;
    --bg-3:#1a1230;
    --paper:#fff7df;
    --ink:#1a0f2e;
    --line:rgba(255,255,255,.08);
    --ui:'Nunito',ui-rounded,-apple-system,sans-serif;
    --pixel:'Press Start 2P',ui-monospace,monospace;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --vt:'VT323',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;padding:0;background:#06010f;color:#fff;font-family:var(--ui);overflow:hidden;height:100%}
  body{
    background:
      radial-gradient(1200px 800px at 50% 20%, rgba(193,71,255,.18), transparent 60%),
      radial-gradient(900px 600px at 20% 80%, rgba(71,160,255,.12), transparent 60%),
      radial-gradient(700px 500px at 80% 90%, rgba(46,230,160,.10), transparent 60%),
      #06010f;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }

  /* tiny pixel-star field on the body */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 13% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 27% 71%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 44% 14%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 61% 41%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 77% 8%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 84% 64%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 9% 86%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 91% 31%, #fff 50%, transparent 51%);
    background-size: 100% 100%;
    opacity:.5;
    z-index:0;
  }

  /* ---------- MacBook frame ---------- */
  .stage{
    position:relative;z-index:1;
    width:min(96vw, 1500px);
    aspect-ratio: 16 / 10.4;
  }
  .mbp{
    position:absolute;inset:0;
    background:linear-gradient(180deg,#3a3a3e 0%, #1c1c1f 60%, #0f0f12 100%);
    border-radius:22px;
    padding:14px 14px 18px 14px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      inset 0 -1px 0 rgba(0,0,0,.6),
      0 30px 80px rgba(0,0,0,.55),
      0 4px 0 #0a0a0c,
      0 6px 0 #0a0a0c;
  }
  .mbp::after{
    /* hinge / bottom lip */
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    bottom:-8px;width:22%;height:8px;
    background:linear-gradient(180deg,#222 0%, #111 100%);
    border-radius:0 0 8px 8px;
  }
  .screen{
    position:relative;width:100%;height:100%;
    background:#000;border-radius:10px;overflow:hidden;
    box-shadow: inset 0 0 0 2px #000, inset 0 0 0 3px #2a2a2e;
  }
  /* Notch */
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:230px;height:30px;
    background:#000;
    border-radius:0 0 18px 18px;
    z-index:50;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .notch.expanded{ height:auto; padding-bottom:14px; }

  /* Camera dot */
  .camera{
    position:absolute;top:9px;right:14px;
    width:8px;height:8px;border-radius:50%;
    background:#0a0a0a;box-shadow:inset 0 0 0 1px #1f1f24, 0 0 3px rgba(46,230,160,.0);
  }

  /* App content sits below the notch */
  .app{
    position:absolute;inset:0;
    overflow:hidden;
    /* both visual directions share this container */
  }

  /* ---------- Pixel sprite engine ---------- */
  svg.psprite{ shape-rendering: crispEdges; image-rendering: pixelated; display:block; }

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none;border:0;cursor:pointer;
    font-family:var(--ui);font-weight:800;font-size:14px;letter-spacing:.02em;
    padding:12px 22px;border-radius:14px;
    color:#06010f;background:linear-gradient(180deg,#3aff b4 0%, var(--mint) 100%);
    background:linear-gradient(180deg,#5cffc1 0%, var(--mint) 100%);
    box-shadow: 0 0 0 1px #06010f, 0 4px 0 #0a8a5a, 0 8px 22px rgba(46,230,160,.35), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .08s ease, box-shadow .08s ease;
    position:relative;
  }
  .btn:active{ transform: translateY(2px); box-shadow: 0 0 0 1px #06010f, 0 2px 0 #0a8a5a, 0 4px 12px rgba(46,230,160,.3), inset 0 1px 0 rgba(255,255,255,.6); }
  .btn.magenta{ background:linear-gradient(180deg,#dc7bff 0%, var(--magenta) 100%); box-shadow: 0 0 0 1px #06010f, 0 4px 0 #6a1aa0, 0 8px 22px rgba(193,71,255,.35), inset 0 1px 0 rgba(255,255,255,.6); color:#fff; }
  .btn.pink{ background:linear-gradient(180deg,#ff8c8c 0%, var(--pink) 100%); box-shadow: 0 0 0 1px #06010f, 0 4px 0 #b03d3d, 0 8px 22px rgba(255,107,107,.35), inset 0 1px 0 rgba(255,255,255,.6); color:#fff;}
  .btn.yellow{ background:linear-gradient(180deg,#ffe890 0%, var(--yellow) 100%); box-shadow: 0 0 0 1px #06010f, 0 4px 0 #b09530, 0 8px 22px rgba(255,217,96,.35), inset 0 1px 0 rgba(255,255,255,.6); }
  .btn.ghost{ background:transparent;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.2), inset 0 1px 0 rgba(255,255,255,.06);}

  /* ---------- Cards ---------- */
  .card{
    background:rgba(14,8,32,.72);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    font-size:11px;font-weight:700;letter-spacing:.04em;
    color:rgba(255,255,255,.75);
  }

  /* ---------- Screen transitions ---------- */
  .screen-fade{ animation: fadein .35s ease; }
  @keyframes fadein{ from{opacity:.6;transform:translateY(6px)} to{opacity:1;transform:none} }

  /* ---------- Gameboy direction overrides ---------- */
  .gb{
    background:#9bbc0f; /* gameboy-pocket green */
    color:#0f380f;
    font-family:var(--pixel) !important;
    font-size:11px;
    image-rendering:pixelated;
  }
  .gb *{ font-family:var(--pixel) !important; letter-spacing:0; }
  .gb .card{
    background:#306230 !important;color:#9bbc0f;border:3px solid #0f380f !important;border-radius:0 !important;
    box-shadow: 0 0 0 1px #9bbc0f inset, 4px 4px 0 #0f380f !important;
    backdrop-filter:none !important;
  }
  .gb .pill{ background:#0f380f !important;color:#9bbc0f !important;border:0 !important;border-radius:0 !important; }
  .gb .btn{
    background:#0f380f !important;color:#9bbc0f !important;border-radius:0;border:3px solid #0f380f;
    box-shadow: 0 0 0 1px #9bbc0f inset, 4px 4px 0 #0f380f !important;
    font-family:var(--pixel) !important; font-size:10px;
    padding:10px 14px;
    text-shadow:none !important;
  }
  .gb .btn.magenta, .gb .btn.pink, .gb .btn.yellow, .gb .btn.ghost { background:#0f380f !important;color:#9bbc0f !important; }
  .gb .btn:active{ transform:translate(2px,2px); box-shadow: 0 0 0 1px #9bbc0f inset, 2px 2px 0 #0f380f !important; }

  /* convert any inline-style gradient backgrounds inside the app to GB green */
  .gb .screen-fade > div[style*="linear-gradient"],
  .gb .screen-fade > div[style*="radial-gradient"]{
    background: #9bbc0f !important;
  }
  .gb .stars-bg{ display:none !important; }
  .gb .scrolling-bg{ background:#9bbc0f !important; }
  .gb .navrail{ background:#0f380f !important;border-radius:0;border:0;box-shadow:0 0 0 3px #9bbc0f !important; }
  .gb .navrail button{color:#9bbc0f !important;font-family:var(--pixel) !important;font-size:9px;border-radius:0}
  .gb .navrail button.active{background:#9bbc0f !important;color:#0f380f !important}
  .gb .notch{ background:#000 !important; }  /* notch stays black */
  .gb svg.type-badge .badge-bg{ fill:#306230; }
  .gb svg.type-badge .badge-outline{ stroke:#0f380f; }

  /* dex grid in GB mode */
  .gb .dex-grid{}
  .gb .dex-cell{background:#306230 !important;border-radius:0;border:2px solid #0f380f !important;color:#9bbc0f !important}
  .gb .dex-cell .dex-num,.gb .dex-cell .dex-name{color:#9bbc0f !important}
  .gb .dex-cell.caught{ background:#8bac0f !important; }

  /* HP / stat bars in GB */
  .gb .hp{background:#0f380f !important;border-radius:0;height:14px;border:2px solid #0f380f}
  .gb .hp i{background:#9bbc0f !important;border-radius:0;box-shadow:none}
  .gb .stat-bar{background:#0f380f !important;border-radius:0}
  .gb .stat-bar i{background:#9bbc0f !important;border-radius:0}

  /* type pills in GB */
  .gb [class*="pill"]{ background:#0f380f !important; color:#9bbc0f !important; }

  /* Generic — strip glow filters; pixel-pure */
  .gb .glow-mint,.gb .glow-mag,.gb .glow-pink,.gb .glow-yellow{ filter:none !important; }

  /* ---------- Tooltips / arrows ---------- */
  .arrow{
    width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid currentColor;
  }

  /* HP bar */
  .hp{height:10px;border-radius:6px;background:#241640;overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);}
  .hp i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pink),var(--mint));box-shadow:0 0 8px rgba(46,230,160,.5)}
  .gb .hp{background:#0f380f;border-radius:0;height:14px;border:2px solid #0f380f}
  .gb .hp i{background:#9bbc0f;border-radius:0;box-shadow:none}

  /* generic stat bar */
  .stat-bar{height:8px;border-radius:4px;background:#241640;overflow:hidden;}
  .stat-bar i{display:block;height:100%;border-radius:4px;}

  /* grass tile */
  .grass-row{
    display:flex;gap:3px;
  }

  /* ---------- Pokedex grid ---------- */
  .dex-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap:12px;
  }
  .dex-cell{
    aspect-ratio:1/1.05;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
    border-radius:12px;
    position:relative;display:flex;align-items:center;justify-content:center;
    cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .dex-cell:hover{transform:translateY(-2px);background:rgba(255,255,255,.07)}
  .dex-cell.caught{ background: radial-gradient(circle at 50% 60%, rgba(46,230,160,.18), transparent 60%), rgba(255,255,255,.04); }
  .dex-cell.locked .silhouette{ filter: brightness(0); opacity:.45; }
  .dex-num{
    position:absolute;top:6px;left:8px;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);font-family:var(--mono);
  }
  .dex-name{
    position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);
  }

  .gb .dex-cell{background:#306230;border-radius:0;border:2px solid #0f380f;color:#9bbc0f}
  .gb .dex-cell .dex-num,.gb .dex-cell .dex-name{color:#9bbc0f}

  /* timer ring */
  .timer-ring{position:relative;width:280px;height:280px;}
  .timer-ring svg{position:absolute;inset:0}

  /* nav rail (bottom) */
  .navrail{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:6px;backdrop-filter: blur(10px);
    z-index:30;
  }
  .navrail button{
    appearance:none;border:0;background:transparent;color:rgba(255,255,255,.6);
    padding:8px 12px;border-radius:12px;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:12px;
    display:flex;align-items:center;gap:6px;
  }
  .navrail button:hover{color:#fff}
  .navrail button.active{background:rgba(255,255,255,.08);color:#fff}

  .gb .navrail{ background:#0f380f;border-radius:0;border:0;box-shadow:0 0 0 3px #9bbc0f}
  .gb .navrail button{color:#9bbc0f;font-family:var(--pixel) !important;font-size:9px;border-radius:0}
  .gb .navrail button.active{background:#9bbc0f;color:#0f380f}

  /* helpers */
  .glow-mint{ filter: drop-shadow(0 0 12px rgba(46,230,160,.5)); }
  .glow-mag{ filter: drop-shadow(0 0 14px rgba(193,71,255,.55)); }
  .glow-yellow{ filter: drop-shadow(0 0 14px rgba(255,217,96,.55)); }
  .glow-pink{ filter: drop-shadow(0 0 14px rgba(255,107,107,.55)); }

  .bob{ animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .pulse{ animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.85} 50%{opacity:1} }

  .sparkle{ animation: sparkle 1.6s ease-in-out infinite; transform-origin:center; }
  @keyframes sparkle{ 0%,100%{ transform:scale(.85); opacity:.6 } 50%{ transform:scale(1.1); opacity:1 } }

  .scrolling-bg{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, transparent 0%, rgba(6,1,15,.6) 100%),
      linear-gradient(180deg, #1a0a3a 0%, #3b0f5a 35%, #6b1f7a 70%, #8a3a5a 100%);
  }
  .stars-bg{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1px 1px at 5% 12%, #fff, transparent 51%),
      radial-gradient(1px 1px at 15% 33%, #fff, transparent 51%),
      radial-gradient(1px 1px at 31% 22%, #fff, transparent 51%),
      radial-gradient(1px 1px at 42% 52%, #fff, transparent 51%),
      radial-gradient(1px 1px at 51% 12%, #fff, transparent 51%),
      radial-gradient(1px 1px at 67% 71%, #fff, transparent 51%),
      radial-gradient(1px 1px at 73% 24%, #fff, transparent 51%),
      radial-gradient(1px 1px at 89% 41%, #fff, transparent 51%),
      radial-gradient(1px 1px at 95% 67%, #fff, transparent 51%);
    opacity:.7;
  }

</style>
</head>
<body>
  <div class="stage">
    <div class="mbp">
      <div class="screen">
        <div id="root"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="sprites.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
